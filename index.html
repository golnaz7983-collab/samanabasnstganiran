<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>سامانه بازنشستگان ایران</title><meta name="theme-color" content="#09254d"><style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f4f7fb;color:#18263d}button,input,select,textarea{font:inherit}button{cursor:pointer}.bar{position:sticky;top:0;z-index:9;background:#09254d;color:#fff;box-shadow:0 4px 18px #0002}.nav{max-width:1100px;margin:auto;display:flex;align-items:center;gap:10px;padding:9px 14px}.logo{width:48px;height:48px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px #d7a62f;display:grid;place-items:center;overflow:hidden}.logo svg{width:100%;height:100%}.brand{font-weight:bold}.brand small{display:block;color:#c8d6e9;font-size:10px;margin-top:3px}.links{margin-right:auto;display:flex;gap:6px;overflow:auto}.links button{border:1px solid #fff2;background:#ffffff10;color:#fff;border-radius:10px;padding:8px 11px;white-space:nowrap}.links .on{background:#d7a62f;color:#12294e}.wrap{max-width:1100px;margin:auto;padding:18px 14px 70px}.hero{background:linear-gradient(135deg,#0a2a59,#17518f);color:#fff;border-radius:22px;padding:24px;display:flex;justify-content:space-between;gap:18px;box-shadow:0 12px 35px #1232}.hero h1{margin:0 0 8px}.hero p{line-height:1.9;color:#dce8f7}.stat{min-width:170px;display:grid;place-items:center;background:#ffffff12;border:1px solid #fff2;border-radius:16px;padding:18px}.stat b{font-size:34px;color:#f0c65c}.section{margin-top:22px}.head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}.head h2{margin:0;font-size:20px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.card{background:#fff;border:1px solid #e2e7ef;border-radius:17px;padding:15px;box-shadow:0 7px 24px #1231}.card h3{margin:7px 0}.badge{display:inline-block;background:#edf4ff;color:#16447d;padding:5px 9px;border-radius:99px;font-size:11px}.meta{line-height:1.9;color:#536178;font-size:13px;margin:10px 0}.btn{border:0;background:#09254d;color:#fff;border-radius:10px;padding:9px 12px}.gold{background:#d7a62f;color:#152a4b}.light{background:#edf2f8;color:#193d6d}.danger{background:#fff0f1;color:#a3212e}.actions{display:flex;gap:7px;flex-wrap:wrap}.empty{text-align:center;color:#778399;padding:28px}.overlay{position:fixed;inset:0;z-index:20;background:linear-gradient(135deg,#06172f,#0e396f);display:grid;place-items:center;padding:18px}.register{width:min(500px,100%);background:#fff;border-radius:24px;padding:24px;box-shadow:0 30px 80px #0007}.register .logo{width:112px;height:112px;margin:auto;box-shadow:0 0 0 5px #d7a62f}.register h2{text-align:center;color:#09254d}.register p{text-align:center;color:#6d7890;line-height:1.8;font-size:13px}.form{display:grid;gap:9px}.form input,.form select,.form textarea{width:100%;border:1px solid #d9e0ea;border-radius:11px;padding:11px;outline:0}.form textarea{min-height:100px}.err{font-size:12px;color:#b52332;min-height:17px}.modal{position:fixed;inset:0;z-index:15;background:#001c3d99;display:grid;place-items:center;padding:14px}.modalbox{width:min(720px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:20px;padding:18px}.close{float:left;border:0;background:#eef2f6;border-radius:8px;padding:6px 9px}.chat{height:55vh;min-height:360px;display:grid;grid-template-rows:1fr auto;border:1px solid #e0e6ee;border-radius:14px;overflow:hidden}.msgs{overflow:auto;padding:12px;background:#f6f8fb}.msg{max-width:78%;background:#fff;border:1px solid #e1e6ed;border-radius:14px;padding:8px 11px;margin:6px 0}.mine{margin-right:auto;background:#eaf3ff}.msg small{display:block;color:#8791a0;font-size:9px;margin-top:3px}.send{display:flex;gap:7px;padding:9px;border-top:1px solid #e1e6ed}.send input{flex:1;border:1px solid #d8e0e9;border-radius:10px;padding:10px}.post{display:grid;gap:8px}.post img{width:100%;max-height:360px;object-fit:cover;border-radius:12px}.avatar{width:38px;height:38px;border-radius:50%;background:#eaf1ff;color:#123d74;display:grid;place-items:center;font-weight:bold}.posthead{display:flex;gap:9px;align-items:center}.doc{border:2px solid #d7a62f;border-radius:15px;padding:20px;background:#fffdf5}.line{display:flex;justify-content:space-between;border-bottom:1px dashed #aaa;padding:9px 0;gap:10px}.toast{position:fixed;z-index:30;bottom:15px;left:15px;background:#122b50;color:#fff;border-radius:10px;padding:10px 14px;display:none}@media(max-width:760px){.grid{grid-template-columns:1fr 1fr}.hero{display:block}.stat{margin-top:15px}.links{max-width:55%}}@media(max-width:520px){.grid{grid-template-columns:1fr}.wrap{padding:12px 9px 60px}.brand small{display:none}.brand{font-size:12px}.logo{width:42px;height:42px}.links button{font-size:11px;padding:7px 9px}}
</style></head><body>
<header class="bar"><div class="nav"><div class="logo" id="topLogo"></div><div class="brand">سامانه بازنشستگان ایران<small>ارتباط، نشاط و گروه‌های شهری</small></div><div class="links"><button data-v="home">خانه</button><button data-v="groups">گروه‌ها</button><button data-v="community">انجمن</button><button data-v="profile">پروفایل</button></div></div></header>
<main id="app" class="wrap"></main>
<div id="reg" class="overlay"><div class="register"><div class="logo" id="regLogo"></div><h2>ثبت‌نام در سامانه</h2><p>قبل از ورود، نام کاربری و شهر خود را انتخاب کنید.</p><form id="regForm" class="form"><input id="uname" maxlength="30" required placeholder="نام کاربری"><select id="ucity" required></select><button class="btn gold">ثبت‌نام و ورود</button><div id="err" class="err"></div></form></div></div>
<div id="modal" class="modal" style="display:none"><div class="modalbox"><button class="close" onclick="closeM()">بستن</button><div id="mb"></div></div></div><div id="toast" class="toast"></div>
<script>
const cities=['تهران','مشهد','اصفهان','شیراز','تبریز','کرج','قم','اهواز','رشت','کرمان','ارومیه','یزد','کرمانشاه','همدان','زاهدان','بندرعباس','ساری','اراک','اردبیل','قزوین','سنندج','خرم‌آباد','گرگان','بوشهر','زنجان','نیشابور','کاشان','آمل','بابل','دزفول','شهرکرد','بیرجند'];
const seed=[['تهران','پارک بازنشستگان تهران','پارک گفتگو','تهران، بزرگراه حکیم، پارک گفتگو','هر روز ۸ تا ۲۱','آلاچیق ۳'],['تهران','گروه پیاده‌روی غرب تهران','پارک نهج‌البلاغه','تهران، اشرفی اصفهانی، پارک نهج‌البلاغه','شنبه تا پنجشنبه ۷ تا ۲۰','آلاچیق ۵'],['مشهد','بازنشستگان پارک ملت مشهد','پارک ملت','مشهد، بلوار وکیل‌آباد، پارک ملت','هر روز ۷ تا ۲۱','آلاچیق ۲'],['اصفهان','همراهان بازنشسته اصفهان','پارک ناژوان','اصفهان، خیابان الفت، ناژوان','هر روز ۸ تا ۲۰','آلاچیق ۴'],['شیراز','گروه نشاط بازنشستگان شیراز','باغ جنت','شیراز، بلوار امیرکبیر، باغ جنت','هر روز ۷ تا ۲۰','آلاچیق ۱'],['تبریز','بازنشستگان ائل‌گلی','پارک ائل‌گلی','تبریز، بلوار ائل‌گلی','هر روز ۸ تا ۲۰','آلاچیق ۶']].map((x,i)=>({id:'g'+i,city:x[0],name:x[1],park:x[2],address:x[3],hours:x[4],gazebo:x[5]}));
const K='retireeIran2';let s={view:'home',user:null,city:'',groups:[],posts:[],msgs:{},polls:[]};
const $=id=>document.getElementById(id);const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);function save(){localStorage.setItem(K,JSON.stringify(s))}function load(){try{Object.assign(s,JSON.parse(localStorage.getItem(K)||'{}'))}catch{}s.groups=s.groups?.length?s.groups:seed.slice();s.posts=s.posts||[];s.msgs=s.msgs||{};s.polls=s.polls||[]}
function logo(){return `<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><circle cx="100" cy="100" r="94" fill="#09254d" stroke="#d7a62f" stroke-width="6"/><circle cx="100" cy="100" r="75" fill="#fff" stroke="#d7a62f" stroke-width="4"/><path d="M100 45c-20 23-31 38-31 57 0 18 14 31 31 31s31-13 31-31c0-19-11-34-31-57z" fill="#d7a62f"/><path d="M48 88c17-17 34-18 51-7-14 2-25 9-35 19 6-12 1-20-16-12zm104 0c-17-17-34-18-51-7 14 2 25 9 35 19-6-12-1-20 16-12z" fill="#09254d"/><path d="M58 124c12 13 25 21 42 25v-29c-16-2-30-9-44-20-7-5-13 2-10 9 3 7 7 11 12 15zm84 0c-12 13-25 21-42 25v-29c16-2 30-9 44-20 7-5 13 2 10 9-3 7-7 11-12 15z" fill="#09254d"/><circle cx="72" cy="57" r="7" fill="#09254d"/><circle cx="128" cy="57" r="7" fill="#09254d"/><circle cx="100" cy="37" r="7" fill="#d7a62f"/></svg>`}function setup(){ $('topLogo').innerHTML=logo();$('regLogo').innerHTML=logo();$('ucity').innerHTML='<option value="">انتخاب شهر</option>'+cities.map(x=>`<option>${x}</option>`).join('') }
function groups(){return s.groups.filter(g=>g.city===s.city)}function toast(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2200)}function render(){if(!s.user){$('reg').style.display='grid';return}$('reg').style.display='none';document.querySelectorAll('[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===s.view));$('app').innerHTML=s.view==='home'?home():s.view==='groups'?groupsPage():s.view==='community'?community():profile()}
function card(g){return `<article class="card"><span class="badge">📍 ${esc(g.city)}</span><h3>${esc(g.name)}</h3><div class="meta">🌳 <b>پارک:</b> ${esc(g.park)}<br>📌 <b>آدرس:</b> ${esc(g.address)}<br>🕒 <b>ساعت:</b> ${esc(g.hours)}<br>🏡 <b>آلاچیق:</b> ${esc(g.gazebo)}</div><div class="actions"><button class="btn" onclick="openG('${g.id}')">ورود به گروه</button><button class="btn light" onclick="doc('${g.id}')">صدور سند</button></div></article>`}
function home(){let gs=groups();return `<section class="hero"><div><h1>سلام ${esc(s.user)} 👋</h1><p>گروه‌های بازنشستگان شهر <b>${esc(s.city)}</b>، آدرس پارک، ساعت فعالیت و آلاچیق را یکجا ببینید و با اعضای گروه گفتگو کنید.</p><div class="actions"><button class="btn gold" onclick="s.view='groups';render()">گروه‌های شهر من</button><button class="btn" onclick="s.view='community';render()">انجمن</button></div></div><div class="stat"><span>گروه‌های فعال شهر</span><b>${gs.length}</b></div></section><section class="section"><div class="head"><h2>گروه‌های ${esc(s.city)}</h2></div><div class="grid">${gs.map(card).join('')||'<div class="card empty">هنوز گروهی برای این شهر ثبت نشده است.</div>'}</div></section>`}
function groupsPage(){return `<section class="section"><div class="head"><div><h2>گروه‌های ${esc(s.city)}</h2><small>فقط گروه‌های همین شهر</small></div><button class="btn gold" onclick="newGroup()">＋ ساخت گروه</button></div><div class="grid">${groups().map(card).join('')||'<div class="card empty">گروهی نیست.</div>'}</div></section>`}
function community(){let ps=s.posts.filter(p=>p.city===s.city).slice().reverse();let polls=s.polls.filter(p=>p.city===s.city).slice().reverse();return `<section class="section"><div class="head"><div><h2>انجمن ${esc(s.city)}</h2><small>پیام، عکس و نظرسنجی</small></div><button class="btn gold" onclick="newPost()">＋ پست</button></div>${polls.map(poll).join('')}${ps.map(post).join('')||'<div class="card empty">هنوز پستی نیست؛ اولین پیام را شما بفرستید.</div>'}</section>`}
function post(p){return `<article class="card post"><div class="posthead"><div class="avatar">${esc(p.user[0])}</div><div><b>${esc(p.user)}</b><div style="color:#778399;font-size:11px">${new Date(p.time).toLocaleString('fa-IR')}</div></div></div><div style="line-height:1.9;white-space:pre-wrap">${esc(p.text)}</div>${p.img?`<img src="${p.img}">`:''}<button class="btn light" onclick="like('${p.id}')">❤️ ${p.likes||0}</button></article>`}
function poll(p){let total=p.opts.reduce((a,o)=>a+o.votes,0);return `<article class="card" style="margin-bottom:12px"><b>📊 ${esc(p.q)}</b><div class="meta">ساخته‌شده توسط ${esc(p.user)}</div>${p.opts.map((o,i)=>`<button class="light" style="width:100%;text-align:right;margin-top:6px;border:0;border-radius:10px;padding:9px" onclick="vote('${p.id}',${i})">${esc(o.text)} — ${o.votes} رأی</button>`).join('')}<small style="color:#778399">مجموع رأی: ${total}</small></article>`}
function profile(){return `<section class="section"><div class="card"><div class="posthead"><div class="avatar">${esc(s.user[0])}</div><div><h2 style="margin:0">${esc(s.user)}</h2><small>شهر: ${esc(s.city)}</small></div></div><hr style="border:0;border-top:1px solid #e4e8ee;margin:16px 0"><div class="actions"><button class="btn light" onclick="changeCity()">تغییر شهر</button><button class="btn danger" onclick="localStorage.removeItem(K);location.reload()">خروج</button></div></div></section>`}
function openG(id){let g=s.groups.find(x=>x.id===id),ms=s.msgs[id]||[];show(`<h2>${esc(g.name)}</h2><div class="meta">🌳 ${esc(g.park)}<br>📌 ${esc(g.address)}<br>🕒 ${esc(g.hours)}<br>🏡 ${esc(g.gazebo)}</div><div class="actions"><button class="btn gold" onclick="doc('${g.id}')">سند</button><button class="btn light" onclick="newPoll('${g.id}')">نظرسنجی</button><button class="btn light" onclick="newPost('${g.id}')">پست/عکس</button></div><div class="chat" style="margin-top:12px"><div id="msgs" class="msgs">${ms.length?ms.map(m=>`<div class="msg ${m.user===s.user?'mine':''}"><b>${esc(m.user)}</b><br>${esc(m.text)}<small>${new Date(m.time).toLocaleString('fa-IR')}</small></div>`).join(''):'<div class="empty">هنوز پیامی نیست.</div>'}</div><form class="send" onsubmit="send(event,'${g.id}')"><input id="msgInput" maxlength="500" placeholder="پیام خود را بنویسید…"><button class="btn">ارسال</button></form></div>`);setTimeout(()=>{$('msgs').scrollTop=$('msgs').scrollHeight},20)}
function show(x){$('mb').innerHTML=x;$('modal').style.display='grid'}function closeM(){$('modal').style.display='none'}function send(e,id){e.preventDefault();let x=$('msgInput').value.trim();if(!x)return;s.msgs[id]??=[];s.msgs[id].push({user:s.user,text:x,time:Date.now()});save();openG(id)}
function newPost(gid=''){show(`<h2>انتشار پست</h2><form class="form" onsubmit="postSave(event,'${gid}')"><select id="pg"><option value="">انجمن شهر</option>${groups().map(g=>`<option value="${g.id}" ${g.id===gid?'selected':''}>${esc(g.name)}</option>`).join('')}</select><textarea id="pt" required maxlength="1000" placeholder="متن پیام…"></textarea><input id="pi" type="file" accept="image/*"><button class="btn gold">انتشار</button></form>`)}
function postSave(e,gid){e.preventDefault();let f=$('pi').files[0],done=img=>{let g=s.groups.find(x=>x.id===($('pg').value||gid));s.posts.push({id:uid(),city:s.city,user:s.user,text:$('pt').value.trim(),img,group:g?.name||'انجمن شهر',time:Date.now(),likes:0});save();closeM();render();toast('پست منتشر شد')};if(f){let r=new FileReader();r.onload=()=>done(r.result);r.readAsDataURL(f)}else done('')}
function like(id){let p=s.posts.find(x=>x.id===id);p.likes=(p.likes||0)+1;save();render()}function newPoll(gid){show(`<h2>نظرسنجی جدید</h2><form class="form" onsubmit="pollSave(event,'${gid}')"><input id="pq" required placeholder="سؤال"><input id="p1" required placeholder="گزینه اول"><input id="p2" required placeholder="گزینه دوم"><input id="p3" placeholder="گزینه سوم اختیاری"><button class="btn gold">ثبت</button></form>`)}function pollSave(e,gid){e.preventDefault();s.polls.push({id:uid(),city:s.city,group:gid,user:s.user,q:$('pq').value,opts:[$('p1').value,$('p2').value,$('p3').value].filter(Boolean).map(text=>({text,votes:0})),time:Date.now()});save();closeM();render();toast('نظرسنجی ثبت شد')}function vote(id,i){let p=s.polls.find(x=>x.id===id);p.opts[i].votes++;save();render()}
function doc(id){let g=s.groups.find(x=>x.id===id),no='IRR-'+Date.now().toString(36).toUpperCase();show(`<div class="doc"><h2 style="text-align:center;color:#09254d">سند ثبت گروه بازنشستگان</h2><div class="line"><span>شماره سند</span><b>${no}</b></div><div class="line"><span>گروه</span><b>${esc(g.name)}</b></div><div class="line"><span>شهر</span><b>${esc(g.city)}</b></div><div class="line"><span>پارک</span><b>${esc(g.park)}</b></div><div class="line"><span>آدرس</span><b>${esc(g.address)}</b></div><div class="line"><span>ساعت</span><b>${esc(g.hours)}</b></div><div class="line"><span>آلاچیق</span><b>${esc(g.gazebo)}</b></div><p style="text-align:center;color:#68758a">صادرشده توسط سامانه بازنشستگان ایران</p></div><button class="btn gold" style="margin-top:10px" onclick="print()">چاپ / PDF</button>`)}
function newGroup(){show(`<h2>ساخت گروه در ${esc(s.city)}</h2><form class="form" onsubmit="groupSave(event)"><input id="gn" required placeholder="نام گروه"><input id="gp" required placeholder="نام پارک"><input id="ga" required placeholder="آدرس پارک"><input id="gh" required placeholder="ساعت فعالیت"><input id="gz" required placeholder="آلاچیق"><button class="btn gold">ساخت گروه</button></form>`)}function groupSave(e){e.preventDefault();s.groups.push({id:uid(),city:s.city,name:$('gn').value,park:$('gp').value,address:$('ga').value,hours:$('gh').value,gazebo:$('gz').value});save();closeM();s.view='groups';render();toast('گروه ساخته شد')}
function changeCity(){$('reg').style.display='grid';$('uname').value=s.user;$('ucity').value=s.city}document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{s.view=b.dataset.v;render()});$('regForm').onsubmit=e=>{e.preventDefault();let u=$('uname').value.trim(),c=$('ucity').value;if(u.length<2)return $('err').textContent='نام کاربری حداقل ۲ حرف باشد.';if(!c)return $('err').textContent='شهر را انتخاب کنید.';s.user=u;s.city=c;save();render();toast('ثبت‌نام انجام شد')};load();setup();render();
</script></body></html>
